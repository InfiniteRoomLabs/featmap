name: CI

on:
  push:
    branches: [master]
  pull_request:

# Action versions pinned to commit SHAs (matching the digest-pinned Dockerfile
# ethos). actions/checkout v4.2.2, actions/setup-go v5.2.0.

# Least-privilege: these jobs only read the repo (build/test/lint).
permissions:
  contents: read

jobs:
  lint:
    name: lint (build, vet, registration test, deadcode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod

      # Use "." not "./..." everywhere: the gitignored data/ dir is
      # permission-denied and breaks package-glob expansion.
      - name: go build
        run: go build .

      - name: go vet
        run: go vet .

      # Pure static-analysis tests -- no database. SKIP_DB_TESTS=1 makes TestMain
      # skip the postgres testcontainer; the ^TestMCP regex selects only the
      # registration/duplicate-name guards.
      - name: MCP registration test
        run: SKIP_DB_TESTS=1 go test -run '^TestMCP' -v .

      - name: Deadcode baseline check
        run: ./scripts/deadcode-check.sh

  test:
    name: test (testcontainers postgres)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod

      # ubuntu-latest runners ship Docker; testcontainers-go (TestMain) spins a
      # postgres:11-alpine container and applies the embedded migrations.
      - name: go test
        run: go test -v .
